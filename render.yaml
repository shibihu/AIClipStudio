# render.yaml — Render Blueprint (https://render.com/docs/blueprint-spec)
#
# Deploy: push this repo, then Render Dashboard → New → Blueprint → pick the repo.
#
# Notes:
#   • No npm dependencies — nothing to install; `npm ci` is skipped on purpose.
#   • vendor/ffmpeg + vendor/ffprobe (static linux builds, ~51 MB each) are
#     committed, so ffmpeg works on any Render runtime without apt installs.
#   • A persistent disk keeps uploaded projects (jobs/) across deploys.
#     Disks require a paid instance — delete the `disk:` block for the free plan
#     (job history will reset on every deploy/restart).
#   • Set GEMINI_API_KEY (or OPENAI_API_KEY / ANTHROPIC_API_KEY) in the service's
#     Environment settings — never commit real keys.
#   • Set AUTH_TOKEN there too if you want the app locked behind a password.
services:
  - type: web
    name: ai-clip-studio
    runtime: node
    plan: 0.5c-512mb         # starter plan; free plan (`free`) has no disks and sleeps after 15 min idle
    autoDeployTrigger: commit  # redeploy on every `git push` to the branch below
    region: singapore        # options: oregon | ohio | virginia | frankfurt | singapore
    branch: main
    buildCommand: chmod +x vendor/ffmpeg vendor/ffprobe || true
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: AUTH_TOKEN
        sync: false          # Render will prompt you (leave empty for open access)
      - key: GEMINI_API_KEY
        sync: false          # Render will prompt you
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: JOBS_TTL_HOURS
      #   value: "24"
    disk:
      name: ai-clip-jobs
      mountPath: /opt/render/project/src/jobs
      sizeGB: 5
